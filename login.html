<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Leonardise</title>
  <link rel="stylesheet" href="assets/css/global.css" />
  <link rel="stylesheet" href="assets/css/login.css" />
</head>
<body>

  <div id="site-header"></div>

  <main class="auth-page">
    <div class="auth-card">

      <span class="auth-logo">Leonardise</span>

      <h1 class="auth-title">Ingresar</h1>
      <p class="auth-subtitle">Accedé a tu cuenta para ver tus pedidos y guardar tus favoritos.</p>

      <form id="login-form" novalidate>
        <input type="hidden" id="csrf-token" name="csrf_token" value="" />

        <div class="field">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="tu@email.com"
            autocomplete="email"
            required
          />
          <span class="field-error" id="email-error"></span>
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          />
          <span class="field-error" id="password-error"></span>
        </div>

        <button type="submit" class="auth-submit" id="login-btn">
          Ingresar
        </button>

        <p id="login-message" class="form-message" role="alert" aria-live="polite"></p>
      </form>

      <div class="auth-divider"><span>o</span></div>

      <p class="auth-switch">
        ¿No tenés cuenta?
        <a href="register.html">Registrate gratis</a>
      </p>

    </div>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/global.js"></script>
  <script src="assets/js/login.js"></script>
</body>
</html>
